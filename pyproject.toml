[project]
name = "knowledgeweaver-p1-python-validation"
version = "0.1.0"
description = "Isolated P1 Python and Docling environment verification"
requires-python = "==3.11.*"
dependencies = [
    "docling>=2,<3",
]

[dependency-groups]
dev = [
    "psutil>=7,<8",
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["verification/environment/python/tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
